<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayTrack — Ravi Construction</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  margin:0;
  padding:20px;
}

.container{
  max-width:1000px;
  margin:auto;
}

h1{
  margin-bottom:20px;
}

button{
  cursor:pointer;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.add-btn{
  background:#7c6af7;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:8px;
}

.card{
  background:#1b1b1b;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.left h3{
  margin:0 0 5px;
}

.small{
  font-size:12px;
  color:#aaa;
}

.amount{
  text-align:right;
}

.pending{
  color:orange;
}

.paid{
  color:#4ecb84;
}

.overdue{
  color:#f76a6a;
}

.actions button{
  margin-left:5px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#222;
  padding:20px;
  border-radius:10px;
  width:400px;
}

input,select,textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  background:#111;
  border:1px solid #333;
  color:#fff;
  border-radius:6px;
}

.save-btn{
  background:#4ecb84;
  border:none;
  padding:10px;
  width:100%;
  color:#fff;
  border-radius:8px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:20px;
}

.stat{
  background:#1b1b1b;
  padding:15px;
  border-radius:10px;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .card{
    flex-direction:column;
    align-items:flex-start;
  }

  .amount{
    text-align:left;
    margin-top:10px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
  <h1>💳 PayTrack — Ravi Construction</h1>
  <button class="add-btn" onclick="openModal()">+ Add Payment</button>
</div>

<div class="stats">

<div class="stat">
  <div>Total</div>
  <h2 id="totalCount">0</h2>
</div>

<div class="stat">
  <div>Pending</div>
  <h2 id="pendingCount">0</h2>
</div>

<div class="stat">
  <div>Paid</div>
  <h2 id="paidCount">0</h2>
</div>

<div class="stat">
  <div>Overdue</div>
  <h2 id="overdueCount">0</h2>
</div>

</div>

<div id="list"></div>

</div>

<!-- ADD PAYMENT MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<h2>Add Payment</h2>

<input id="name" placeholder="Payment Name">

<input id="amount" type="number" placeholder="Amount">

<select id="category">
<option>Utility</option>
<option>Loan/EMI</option>
<option>Material</option>
<option>Labour</option>
<option>Other</option>
</select>

<input id="dueDate" type="date">

<textarea id="notes" placeholder="Notes"></textarea>

<button class="save-btn" onclick="savePayment()">Save Payment</button>

</div>
</div>

<!-- PAY MODAL -->

<div class="modal" id="payModal">

<div class="modal-content">

<h2>Pay Amount</h2>

<input id="payAmount" type="number" placeholder="Amount Paid">

<select id="payMethod">
<option>UPI</option>
<option>Cash</option>
<option>Bank Transfer</option>
<option>Cheque</option>
</select>

<input id="payDate" type="date">

<input id="payRef" placeholder="Reference">

<button class="save-btn" onclick="savePaid()">Save Payment</button>

</div>
</div>

<script>

const STORAGE_KEY = 'paytrack_ravi';

let payments = [];
let currentPayId = null;

load();

function uid(){
  return Date.now().toString(36);
}

function today(){
  return new Date().toISOString().split('T')[0];
}

function load(){

  const saved = localStorage.getItem(STORAGE_KEY);

  if(saved){
    payments = JSON.parse(saved);
  } else {

    payments = [
      {
        id:uid(),
        name:'Electricity Bill',
        amount:2000,
        paidAmount:1000,
        remaining:1000,
        category:'Utility',
        dueDate:today(),
        status:'pending',
        notes:'Office',
        paidMethod:'UPI',
        paidDate:today(),
        paidRef:'ABC123'
      }
    ];
  }

  render();
}

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payments));
}

function render(){

  const list = document.getElementById('list');

  let total = 0;
  let pending = 0;
  let paid = 0;
  let overdue = 0;

  list.innerHTML = '';

  payments.forEach(p => {

    total++;

    if(p.status === 'paid'){
      paid++;
    } else {

      const due = new Date(p.dueDate);
      const now = new Date();

      if(due < now){
        overdue++;
      } else {
        pending++;
      }
    }

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div class="left">
        <h3>${p.name}</h3>

        <div class="small">
          ${p.category} • Due ${p.dueDate}
        </div>

        <div class="small">
          Paid ₹${p.paidAmount || 0}
          /
          ₹${p.amount}
        </div>
      </div>

      <div class="amount">

        <div class="${
          p.status === 'paid'
          ? 'paid'
          : p.remaining > 0
          ? 'pending'
          : 'paid'
        }">

          ₹${p.remaining}

        </div>

        <div class="actions">

          <button onclick="openPay('${p.id}')">
            Pay
          </button>

          <button onclick="deletePayment('${p.id}')">
            Delete
          </button>

        </div>

      </div>
    `;

    list.appendChild(card);

  });

  document.getElementById('totalCount').innerText = total;
  document.getElementById('pendingCount').innerText = pending;
  document.getElementById('paidCount').innerText = paid;
  document.getElementById('overdueCount').innerText = overdue;

}

function openModal(){
  document.getElementById('modal').style.display = 'flex';
}

function closeModal(){
  document.getElementById('modal').style.display = 'none';
}

function savePayment(){

  const payment = {

    id:uid(),

    name:document.getElementById('name').value,

    amount:Number(document.getElementById('amount').value),

    paidAmount:0,

    remaining:Number(document.getElementById('amount').value),

    category:document.getElementById('category').value,

    dueDate:document.getElementById('dueDate').value,

    status:'pending',

    notes:document.getElementById('notes').value,

    paidMethod:null,

    paidDate:null,

    paidRef:null

  };

  payments.unshift(payment);

  persist();

  render();

  closeModal();

}

function openPay(id){

  currentPayId = id;

  document.getElementById('payDate').value = today();

  document.getElementById('payModal').style.display = 'flex';

}

function savePaid(){

  const p = payments.find(x => x.id === currentPayId);

  if(!p) return;

  const amt =
    Number(document.getElementById('payAmount').value);

  p.paidAmount += amt;

  if(p.paidAmount > p.amount){
    p.paidAmount = p.amount;
  }

  p.remaining = p.amount - p.paidAmount;

  if(p.remaining <= 0){
    p.status = 'paid';
  }

  p.paidMethod =
    document.getElementById('payMethod').value;

  p.paidDate =
    document.getElementById('payDate').value;

  p.paidRef =
    document.getElementById('payRef').value;

  persist();

  render();

  document.getElementById('payModal').style.display = 'none';

}

function deletePayment(id){

  payments = payments.filter(p => p.id !== id);

  persist();

  render();

}

window.onclick = function(e){

  if(e.target.id === 'modal'){
    closeModal();
  }

  if(e.target.id === 'payModal'){
    document.getElementById('payModal').style.display = 'none';
  }

}

</script>

</body>
</html>
